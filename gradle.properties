# ЛР1–4. Общие параметры сборки. Настройки среды разработки могут переопределять эти значения.
# Параметры памяти и кодировки процесса Gradle.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=COMPAT
# Использование библиотек AndroidX.
android.useAndroidX=true
# Официальный стиль оформления Kotlin.
kotlin.code.style=official
# Класс ресурсов каждого модуля содержит только его собственные ресурсы.
android.nonTransitiveRClass=true
# Разрешаем путь проекта с кириллицей.
android.overridePathCheck=true
